<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon/Favicon_32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Neural Activity Visualizer — React component demo" />
    <link rel="apple-touch-icon" href="./favicon/Favicon_32x32.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Neural Activity Visualizer</title>
    <script>
      // Set the theme before first paint (see useTheme in src/App.js).
      try {
        document.documentElement.setAttribute(
          "data-theme", localStorage.getItem("neo-viewer-theme") === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <script type="module">
      import { defineCustomElements } from 'https://cdn.jsdelivr.net/npm/@ebrains/components@3.0.0/dist/esm/loader.js';
      defineCustomElements(window);
    </script>
    <!-- Matomo (EBRAINS Stats): production site only -->
    <script>
      if (window.location.hostname === "neoviewer.apps.ebrains.eu") {
        var _paq = window._paq = window._paq || [];
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function() {
          var u = "https://stats.humanbrainproject.eu/";
          _paq.push(['setTrackerUrl', u + 'matomo.php']);
          _paq.push(['setSiteId', '42']);
          var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
          g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s);
        })();
      }
    </script>
    <!-- End Matomo Code -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
